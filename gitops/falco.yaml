# Falco runtime threat detection, deployed via ArgoCD (multi-source: the upstream
# Falco chart + our values/rules from this repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 9.1.0
      helm:
        valueFiles:
          - $rs/falco/values.yaml
    - repoURL: https://gitlab.com/teodorio95/runtime-security.git
      targetRevision: HEAD
      ref: rs
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
